[project]
name = "trakindopib-sharepoint"
version = "0.1.0"
description = "Sharepoint web automation for CEISA documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright==1.61.0",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
]

[tool.ruff]
line-length = 96

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
combine-as-imports = true